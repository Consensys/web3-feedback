---
name: Check for broken links

on:
  pull_request:
    branches:
      - main

jobs:

  linkCheck:
    name: Link Checking
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file-extensions: [".md", ".mdx"]
    steps:
      - name: Wiz sensor
        uses: Consensys/github-actions/wiz-sensor@c529b19afef5a8e2ff6993638a99a905de633ddb
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@v4
      - name: LinkCheck
        uses: Consensys/github-actions/docs-link-check@main
        with:
          FILE_EXTENSION: '${{ matrix.file-extensions }}'
          CONFIG_FILE: 'mlc_config.json'
