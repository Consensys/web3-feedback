---
name: Check file name case

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  case:
    name: Check for case being inconsistent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ["docs"]
    permissions:
      contents: read
    steps:
      - name: Wiz sensor
        uses: Consensys/github-actions/wiz-sensor@c529b19afef5a8e2ff6993638a99a905de633ddb
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@v4

      - name: Case check action
        uses: Consensys/github-actions/docs-case-check@main
        with:
          DOC_DIR: ${{ matrix.folder }}
